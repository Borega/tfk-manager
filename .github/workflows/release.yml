name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-latest-large, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Set app version
        env:
          VERSION: 0.0.${{ github.run_number }}
        run: node scripts/set-version.mjs

      - name: Copy backend resources
        run: node scripts/copy-backend.mjs

      - name: Build and release
        uses: tauri-apps/tauri-action@action-v0.6.1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v0.0.${{ github.run_number }}
          releaseName: "TFK Manager v0.0.${{ github.run_number }}"
          releaseBody: "Automated build from main."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify updater assets
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseId = process.env.RELEASE_ID;
            if (!releaseId) {
              core.setFailed("Missing releaseId from tauri-action output.");
              return;
            }
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(releaseId),
              per_page: 100,
            });
            const names = assets.map((asset) => asset.name);
            if (!names.includes("latest.json")) {
              core.setFailed(`latest.json is missing from release assets. Found: ${names.join(", ")}`);
            }
